name: Clovix build
on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clovix-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.8.0
      - name: Build mod
        run: gradle build --stacktrace 2>&1 | tee clovix-build.log
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clovix-build-failure-log
          path: clovix-build.log
          if-no-files-found: warn
      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clovix-build
          path: build/libs/*.jar
          if-no-files-found: error
